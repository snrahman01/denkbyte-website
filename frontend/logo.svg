<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="DenkByte logo">
  <defs>
    <linearGradient id="db-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C3E50"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="db-spark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#34A853"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
  </defs>

  <!-- microchip pins -->
  <g fill="#1A252F">
    <rect x="8"  y="40" width="9" height="8" rx="2"/>
    <rect x="8"  y="56" width="9" height="8" rx="2"/>
    <rect x="8"  y="72" width="9" height="8" rx="2"/>
    <rect x="103" y="40" width="9" height="8" rx="2"/>
    <rect x="103" y="56" width="9" height="8" rx="2"/>
    <rect x="103" y="72" width="9" height="8" rx="2"/>
    <rect x="40" y="8"   width="8" height="9" rx="2"/>
    <rect x="56" y="8"   width="8" height="9" rx="2"/>
    <rect x="72" y="8"   width="8" height="9" rx="2"/>
    <rect x="40" y="103" width="8" height="9" rx="2"/>
    <rect x="56" y="103" width="8" height="9" rx="2"/>
    <rect x="72" y="103" width="8" height="9" rx="2"/>
  </g>

  <!-- chip body -->
  <rect x="16" y="16" width="88" height="88" rx="24" fill="url(#db-chip)"/>
  <rect x="16" y="16" width="88" height="88" rx="24" fill="none" stroke="#00D9FF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- neural "thought" tree (Denk) -->
  <g stroke="url(#db-spark)" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M60 88 L60 58"/>
    <path d="M60 64 L42 44"/>
    <path d="M60 64 L78 44"/>
    <path d="M60 58 L60 34"/>
    <path d="M42 44 L34 32"/>
    <path d="M78 44 L86 32"/>
  </g>

  <!-- nodes -->
  <circle cx="60" cy="88" r="7.5" fill="#ffffff"/>
  <circle cx="60" cy="34" r="6" fill="#00D9FF"/>
  <circle cx="42" cy="44" r="4.5" fill="#00D9FF"/>
  <circle cx="78" cy="44" r="4.5" fill="#00D9FF"/>
  <circle cx="34" cy="32" r="4" fill="#ffffff"/>
  <circle cx="86" cy="32" r="4" fill="#ffffff"/>

  <!-- byte dots -->
  <circle cx="40" cy="80" r="2.6" fill="#ffffff" opacity="0.7"/>
  <circle cx="80" cy="80" r="2.6" fill="#ffffff" opacity="0.7"/>
</svg>
