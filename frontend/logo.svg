<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 230" role="img" aria-label="DenkByte logo">
  <defs>
    <radialGradient id="brainFill" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#0E3A47"/>
      <stop offset="1" stop-color="#061820"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#2CD98A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- brain lobe cluster -->
    <g id="brain-lobes">
      <circle cx="120" cy="66" r="22"/>
      <circle cx="92"  cy="74" r="20"/>
      <circle cx="148" cy="74" r="20"/>
      <circle cx="74"  cy="96" r="20"/>
      <circle cx="166" cy="96" r="20"/>
      <circle cx="120" cy="94" r="27"/>
      <circle cx="88"  cy="116" r="19"/>
      <circle cx="152" cy="116" r="19"/>
      <circle cx="120" cy="122" r="24"/>
      <circle cx="104" cy="136" r="17"/>
      <circle cx="136" cy="136" r="17"/>
      <circle cx="112" cy="150" r="12"/>
      <circle cx="128" cy="150" r="12"/>
    </g>
  </defs>

  <!-- orbiting binary rings (behind + front halves share one layer for simplicity) -->
  <g filter="url(#glow)" fill="none" stroke="url(#ring)" stroke-linecap="round">
    <ellipse cx="120" cy="112" rx="112" ry="40" transform="rotate(-22 120 112)"
             stroke-width="3" stroke-dasharray="3 11" opacity="0.95"/>
    <ellipse cx="120" cy="112" rx="112" ry="40" transform="rotate(24 120 112)"
             stroke-width="3" stroke-dasharray="3 11" opacity="0.8"/>
    <ellipse cx="120" cy="112" rx="104" ry="30" transform="rotate(4 120 112)"
             stroke-width="2" stroke-dasharray="2 12" opacity="0.5"/>
  </g>

  <!-- binary digits along the orbits -->
  <g fill="#7DF9FF" font-family="monospace" font-size="12" font-weight="700" opacity="0.85">
    <text x="30" y="96">1</text>
    <text x="48" y="70">0</text>
    <text x="196" y="150">0</text>
    <text x="206" y="120">1</text>
    <text x="150" y="40">1</text>
    <text x="78" y="186">0</text>
    <text x="128" y="196">1</text>
    <text x="36" y="150">1</text>
  </g>

  <!-- glow halo behind brain -->
  <use href="#brain-lobes" fill="#00E5FF" filter="url(#softglow)" opacity="0.35"/>

  <!-- brain body -->
  <use href="#brain-lobes" fill="url(#brainFill)" stroke="#00E5FF" stroke-width="1.4" opacity="0.98"/>

  <!-- brain folds + fissure -->
  <g fill="none" stroke="#39E6FF" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" opacity="0.9">
    <path d="M120 50 C116 80 124 104 120 150"/>
    <path d="M96 76 C84 90 98 102 84 114"/>
    <path d="M100 112 C90 122 106 130 96 142"/>
    <path d="M144 76 C156 90 142 102 156 114"/>
    <path d="M140 112 C150 122 134 130 144 142"/>
    <path d="M120 150 L120 178"/>
  </g>
</svg>
