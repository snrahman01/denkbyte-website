# Netlify configuration for the DenkByte site (Vite + React + TypeScript).
# Netlify runs the build command and publishes the generated `dist/` folder.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# HTML always revalidates so new deploys show immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# Vite fingerprints everything in /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Routes (keep in sync with src/router.tsx): served by the app with status 200.
[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/vision"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/team"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/patch-notes"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/impressum"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

# Everything else: the app shows its 404 page, and Netlify sends a real 404 status.
# (Existing files like /logo.svg or /assets/* are still served normally.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
