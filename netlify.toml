# Netlify configuration for the DenkByte site (Vite + React + TypeScript).
# Netlify runs the build command and publishes the generated `dist/` folder.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# HTML always revalidates so new deploys show immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# Vite fingerprints everything in /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unknown paths: serve the app with a real 404 status; App.tsx then shows the NotFound page.
# (Existing files like /logo.svg or /assets/* are still served normally.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
