# Netlify configuration for the DenkByte static site.
# Plain static files at the repo root (no build step), so we publish the root.

[build]
  publish = "."
  command = ""

# Sensible caching: HTML/JSON always revalidate so content updates show immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
